services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: biography_db
      MYSQL_ROOT_PASSWORD: biography
    ports:
      - "3306:3306"
    volumes:
      - biography_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend/api-server/biography
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/biography_db
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  biography_mysql_data: